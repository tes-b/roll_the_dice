<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roll The Dice</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f5f6fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .game-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 560px; text-align: center; position: relative; }
        h1 { color: #2f3542; margin-top: 0; margin-bottom: 20px; font-size: 2.2rem; letter-spacing: -1px; font-weight: 800; }
        :root {
            --tier-1-color: #2ed573;
            --tier-2-color: #1e90ff;
            --tier-3-color: #a55eea;
            --tier-s-color: #f1c40f;
        }
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; font-size: 1.05rem; gap: 10px; }

        .panel { margin-bottom: 15px; padding: 15px; background-color: #f0f0f0; border-radius: 10px; }
        .score-progress { margin-bottom: 12px; padding: 16px; background-color: #f0f0f0; border-radius: 12px; }
        .score-progress-labels { display: flex; justify-content: space-between; font-size: 0.78rem; color: #57606f; font-weight: 700; margin-bottom: 6px; }
        .score-progress-value { font-size: 2.2rem; font-weight: 800; color: #2f3542; letter-spacing: -0.5px; }
        .score-progress-value .slash { margin: 0 8px; color: #a4b0be; }
        .round-summary { margin-bottom: 10px; }
        .round-score { font-size: 2.4rem; font-weight: 800; color: #2f3542; line-height: 1.15; }
        .round-gold { margin-top: 4px; font-size: 1.2rem; font-weight: 700; color: #ffa502; }
        .calc-status { min-height: 24px; margin-top: 18px; color: #57606f; font-size: 0.95rem; font-weight: 600; }

        .dice-container { display: flex; justify-content: center; gap: 10px; margin: 14px 0 24px; flex-wrap: wrap; min-height: 90px; }
        .dice { width: 70px; height: 70px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 1.4rem; font-weight: bold; color: white; transition: 0.2s; border: 4px solid #ddd; position: relative; overflow: visible; }
        .dice-result { pointer-events: none; }
        .dice.red { background-color: #ff4757; border-color: var(--tier-border-color, #ff6b81); box-shadow: 0 4px 0 #ee3545; }
        .dice.blue { background-color: #2f3542; border-color: var(--tier-border-color, #57606f); box-shadow: 0 4px 0 #1e242e; }
        .dice.rolling { animation: shake 0.2s infinite; }
        .dice.drag-source { opacity: 0.5; }
        .dice.drag-over { outline: 3px dashed #70a1ff; outline-offset: 4px; }
        /* 티어 색상은 외곽선이 아닌 주사위 기본 테두리 색에 반영합니다. */
        .dice.tier-1 { --tier-border-color: var(--tier-1-color); }
        .dice.tier-2 { --tier-border-color: var(--tier-2-color); }
        .dice.tier-3 { --tier-border-color: var(--tier-3-color); }
        .dice.tier-S { --tier-border-color: var(--tier-s-color); }

        .dice-faces {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 10px);
            transform: translateX(-50%) translateY(4px);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            width: 132px;
            padding: 8px;
            border-radius: 10px;
            background: rgba(47, 53, 66, 0.95);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 20;
        }
        .dice-faces::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 100%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: rgba(47, 53, 66, 0.95);
        }
        .dice:hover .dice-faces { opacity: 1; transform: translateX(-50%) translateY(0); }
        .face-cell { font-size: 0.72rem; font-weight: 700; color: white; padding: 4px 2px; border-radius: 6px; text-align: center; border: 1px solid rgba(255,255,255,0.15); }
        .face-cell.red { background-color: #ff4757; }
        .face-cell.blue { background-color: #57606f; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #roll-btn { background-color: #2ed573; color: white; font-size: 1.1rem; box-shadow: 0 4px 0 #26af5f; }
        #submit-btn { background-color: #1e90ff; color: white; font-size: 1.1rem; box-shadow: 0 4px 0 #1b76cf; }
        #next-stage-btn { width: 100%; background-color: #2f3542; color: white; font-size: 1.1rem; box-shadow: 0 4px 0 #1e242e; }
        button:disabled { background-color: #ccc !important; box-shadow: none !important; cursor: not-allowed; }

        .hidden { display: none; }
        .shop { margin-top: 22px; border-top: 2px solid #eee; padding-top: 16px; text-align: left; }
        .shop-title { font-size: 1rem; font-weight: 800; margin-bottom: 8px; color: #2f3542; }
        .shop-meta { font-size: 0.85rem; color: #57606f; margin-bottom: 10px; }
        .shop-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .shop-actions button { font-size: 0.85rem; padding: 10px 8px; }
        .shop-actions button small { display: block; font-size: 0.72rem; margin-top: 3px; opacity: 0.9; }
        .shop-next-btn-wrap { margin-top: 10px; }
        .dice.shop-selected { outline: 4px solid #1e90ff; outline-offset: 3px; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { width: min(680px, 92vw); background: white; border-radius: 16px; padding: 22px; }
        .modal-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; }
        .draft-grid { margin-top: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
        .draft-card { border: 2px solid #dfe4ea; border-radius: 12px; padding: 10px; cursor: pointer; text-align: left; }
        .draft-card.selected { border-color: #1e90ff; background-color: #f1f8ff; }
        .draft-card-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; color: #2f3542; }
        .draft-faces { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
        .draft-face { font-size: 0.72rem; border-radius: 6px; text-align: center; padding: 4px 0; font-weight: 700; color: white; }
        .draft-face.pos { background: #ff4757; }
        .draft-face.neg { background: #57606f; }
        .draft-face.neu { background: #2f3542; }

        @keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(5deg); } 75% { transform: rotate(-5deg); } 100% { transform: rotate(0deg); } }
    </style>
</head>
<body>
<div class="game-card">
    <h1>Roll The Dice</h1>

    <div class="header">
        <div>스테이지: <span id="stage-num">1</span> / <span id="stage-max">10</span></div>
        <div style="color: #ffa502;">보유 골드: <span id="gold">0</span>G</div>
    </div>

    <div class="score-progress">
        <div class="score-progress-labels">
            <span>Stage Score (제출된 점수)</span>
            <span>Target Score (목표점수)</span>
        </div>
        <div class="score-progress-value">
            <span id="total-score">0</span><span class="slash">/</span><span id="target-score">3</span>
        </div>
    </div>

    <div style="margin-bottom: 12px; color: #666;">남은 롤: <span id="rolls-left">5</span>/<span id="rolls-max">5</span></div>
    <div class="round-summary">
        <div class="round-score" id="round-score">0</div>
        <div class="round-gold" id="round-gold">0G</div>
    </div>

    <div id="dice-container" class="dice-container"></div>

    <div id="stage-controls" class="controls">
        <button id="roll-btn">주사위 굴리기</button>
        <button id="submit-btn" disabled>제출</button>
    </div>

    <div id="shop-panel" class="shop hidden">
        <div class="shop-title">상점</div>
        <div id="shop-meta" class="shop-meta">주사위를 선택하고 행동을 고르세요.</div>
        <div class="shop-actions">
            <button id="shop-abs-up-btn">절대값 +1<small id="shop-abs-up-price">0G</small></button>
            <button id="shop-face-up-btn">눈금 +1<small id="shop-face-up-price">0G</small></button>
            <button id="shop-face-down-btn">눈금 -1<small id="shop-face-down-price">0G</small></button>
            <button id="shop-invert-btn">부호 반전<small id="shop-invert-price">0G</small></button>
            <button id="shop-sell-btn">판매<small id="shop-sell-price">0G</small></button>
            <button id="shop-draw-btn">뽑기<small id="shop-draw-price">0G</small></button>
        </div>
        <div class="shop-next-btn-wrap">
            <button id="next-stage-btn">Next Stage</button>
        </div>
    </div>

    <div id="calc-status" class="calc-status"></div>
</div>

<div id="dice-draft-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-title">주사위 뽑기</div>
        <div id="draft-desc" style="font-size:0.9rem;color:#57606f;">3개 중 1개를 선택하세요.</div>
        <div id="draft-grid" class="draft-grid"></div>
        <button id="draft-confirm-btn" style="margin-top:14px; width:100%;" disabled>선택 완료</button>
    </div>
</div>

<div id="result-modal" class="modal-overlay">
    <div class="modal-content" style="text-align:center;">
        <div class="modal-title" id="result-title">게임 종료</div>
        <div id="result-desc" style="margin-bottom:14px;"></div>
        <button id="restart-btn" style="width:100%;">다시 시작</button>
    </div>
</div>

<script>
    // 하드코딩된 밸런스 값을 모두 상수로 분리해 추후 조정이 쉽도록 구성합니다.
    const CONFIG = Object.freeze({
        TOTAL_STAGES: 10,
        INITIAL_ROLLS_PER_STAGE: 5,
        DRAFT_OPTION_COUNT: 3,
        DRAFT_PICK_COUNT: 1,
        CLEAR_BASE_GOLD: 10,
        CLEAR_GOLD_PER_REMAINING_ROLL: 2,
        ROLL_ANIMATION_MS: 500,
        RESULT_DELAY_MS: 300,
        // 단일 선택 모드에서 다른 카드를 클릭하면 기존 선택을 교체합니다.
        DRAFT_REPLACE_SELECTION_WHEN_FULL: true,
        STAGE_TARGETS: Object.freeze([3, 6, 12, 20, 30, 42, 56, 72, 90, 110]),
        TIER_PROBABILITIES: Object.freeze([
            Object.freeze({ tierKey: '1', weight: 80 }),
            Object.freeze({ tierKey: '2', weight: 15 }),
            Object.freeze({ tierKey: '3', weight: 4 }),
            Object.freeze({ tierKey: 'S', weight: 1 })
        ]),
        // 상점 기본 가격은 밸런스 조정을 쉽게 하기 위해 상수로 분리합니다.
        SHOP_BASE_PRICES: Object.freeze({
            ABS_UP: 7,
            FACE_UP: 2,
            FACE_DOWN: 2,
            SIGN_INVERT: 2,
            SELL: 0,
            DRAW: 5
        }),
        // 판매 골드 규칙(1/3/9/27)을 등급별 상수로 고정합니다.
        SELL_GOLD_BY_TIER: Object.freeze({
            '1': 1,
            '2': 3,
            '3': 9,
            'S': 27
        })
    });

    // 요구사항의 기본 시작 주사위를 상수 배열로 고정합니다.
    const BASE_STARTER_DICE = Object.freeze([
        Object.freeze(['0', '0', '0', '+1', '+1', '+1']),
        Object.freeze(['0', '0', '+1', '+1', '+1G', '+1G']),
        Object.freeze(['-1', '-1', '0', '0', '+1', '+1'])
    ]);

    // 기존 소스코드의 전체 주사위 카탈로그를 유지해 밸런스/콘텐츠 자산이 보존되도록 합니다.
    const DICE_CATALOG_RAW = Object.freeze({
        '1': Object.freeze([
            Object.freeze(['1G', '1G', '1G', '0G', '0G', '0G']),
            Object.freeze(['2G', '2G', '2G', '-2G', '-2G', '-2G']),
            Object.freeze(['0', '0', '0', '+1', '+1', '+1']),
            Object.freeze(['-1', '-1', '-1', '+1', '+1', '+1']),
            Object.freeze(['-1', '-1', '-1', '+2', '+2', '+2']),
            Object.freeze(['-3', '-3', '-3', '+3', '+3', '+3']),
            Object.freeze(['-3', '-2', '-1', '+1', '+2', '+3'])
        ]),
        '2': Object.freeze([
            Object.freeze(['-1', '-2', '-3', '+4', '+5', '+6']),
            Object.freeze(['-2', '-2', '-2', '+2', '+2', '+2']),
            Object.freeze(['-4', '-4', '-4', '+4', '+4', '+4']),
            Object.freeze(['-5', '-5', '-5', '+5', '+5', '+5']),
            Object.freeze(['-4', '-4', '-4', '+4', '+4', '+4']),
            Object.freeze(['4G', '4G', '4G', '-4G', '-4G', '-4G'])
        ]),
        '3': Object.freeze([
            Object.freeze(['10', '10', '10', '10', '10', '10']),
            Object.freeze(['-10', '-10', '-10', '-10', '-10', '-10']),
            Object.freeze(['6G', '6G', '6G', '-6G', '-6G', '-6G'])
        ]),
        'S': Object.freeze([
            Object.freeze(['x1', 'x2', 'x3', 'x4', 'x5', 'x6'])
        ])
    });

    const TIER_NAMES = Object.freeze({ '1': 'Tier1', '2': 'Tier2', '3': 'Tier3', 'S': 'TierS' });
    // 라운드 요약 표기의 기본값을 상수로 분리해 유지보수를 쉽게 합니다.
    const ROUND_SUMMARY_DEFAULT = Object.freeze({
        SCORE: '0',
        GOLD: '0G'
    });
    // 눈 문자열 파싱 규칙을 상수화해 향후 표기 확장 시 수정 지점을 단일화합니다.
    const FACE_TOKEN_RULES = Object.freeze({
        GOLD_SUFFIX: 'G',
        MULTIPLIER_PREFIX: 'x'
    });

    function buildDiceCatalog(rawCatalog) {
        return Object.freeze(Object.entries(rawCatalog).reduce((acc, [tierKey, diceList]) => {
            acc[tierKey] = Object.freeze(diceList.map((faces, index) => Object.freeze({
                id: `${tierKey}-${index + 1}`,
                tierKey,
                tierName: TIER_NAMES[tierKey],
                faces: Object.freeze([...faces])
            })));
            return acc;
        }, {}));
    }

    const DICE_CATALOG = buildDiceCatalog(DICE_CATALOG_RAW);


    function createInitialShopPriceIncreaseMap() {
        return Object.fromEntries(Object.keys(CONFIG.SHOP_BASE_PRICES).map((actionKey) => [actionKey, 0]));
    }

    let currentStage = 1;
    let stageScore = 0;
    let totalGold = 0;
    // 롤 제한 횟수는 진행 중 변경될 수 있도록 상수 대신 변수로 관리합니다.
    let rollsPerStage = CONFIG.INITIAL_ROLLS_PER_STAGE;
    let rollsLeftInStage = rollsPerStage;
    let diceState = [];
    let lastRollResults = [];
    let isDrafting = false;
    let isRolling = false;
    let draggingDiceIndex = null;
    let isShopPhase = false;
    let selectedShopDiceIndex = null;
    // 상점 행동별 가격 증가량은 개별적으로 누적 관리합니다.
    let shopActionPriceIncrease = createInitialShopPriceIncreaseMap();

    const rollBtn = document.getElementById('roll-btn');
    const submitBtn = document.getElementById('submit-btn');
    const nextStageBtn = document.getElementById('next-stage-btn');
    const stageControls = document.getElementById('stage-controls');
    const shopPanel = document.getElementById('shop-panel');
    const diceContainer = document.getElementById('dice-container');
    const calcStatusEl = document.getElementById('calc-status');
    const scoreEl = document.getElementById('total-score');
    const goldEl = document.getElementById('gold');
    const roundScoreEl = document.getElementById('round-score');
    const roundGoldEl = document.getElementById('round-gold');
    const stageEl = document.getElementById('stage-num');
    const stageMaxEl = document.getElementById('stage-max');
    const targetEl = document.getElementById('target-score');
    const rollsLeftEl = document.getElementById('rolls-left');
    const rollsMaxEl = document.getElementById('rolls-max');
    const shopMetaEl = document.getElementById('shop-meta');
    const shopAbsUpBtn = document.getElementById('shop-abs-up-btn');
    const shopFaceUpBtn = document.getElementById('shop-face-up-btn');
    const shopFaceDownBtn = document.getElementById('shop-face-down-btn');
    const shopInvertBtn = document.getElementById('shop-invert-btn');
    const shopSellBtn = document.getElementById('shop-sell-btn');
    const shopDrawBtn = document.getElementById('shop-draw-btn');

    const shopAbsUpPriceEl = document.getElementById('shop-abs-up-price');
    const shopFaceUpPriceEl = document.getElementById('shop-face-up-price');
    const shopFaceDownPriceEl = document.getElementById('shop-face-down-price');
    const shopInvertPriceEl = document.getElementById('shop-invert-price');
    const shopSellPriceEl = document.getElementById('shop-sell-price');
    const shopDrawPriceEl = document.getElementById('shop-draw-price');

    const draftModal = document.getElementById('dice-draft-modal');
    const draftGridEl = document.getElementById('draft-grid');
    const draftDescEl = document.getElementById('draft-desc');
    const draftConfirmBtn = document.getElementById('draft-confirm-btn');

    const resultModal = document.getElementById('result-modal');
    const resultTitleEl = document.getElementById('result-title');
    const resultDescEl = document.getElementById('result-desc');
    const restartBtn = document.getElementById('restart-btn');

    // 눈 문자열을 타입별(점수/골드/곱셈)로 해석하는 공통 유틸 함수입니다.
    function parseFaceToken(faceToken) {
        const normalized = String(faceToken).trim();

        if (normalized.startsWith(FACE_TOKEN_RULES.MULTIPLIER_PREFIX)) {
            const multiplier = Number(normalized.slice(FACE_TOKEN_RULES.MULTIPLIER_PREFIX.length));
            return {
                type: 'multiplier',
                value: Number.isFinite(multiplier) ? multiplier : 0
            };
        }

        if (normalized.endsWith(FACE_TOKEN_RULES.GOLD_SUFFIX)) {
            const goldValue = Number(normalized.slice(0, -FACE_TOKEN_RULES.GOLD_SUFFIX.length));
            return {
                type: 'gold',
                value: Number.isFinite(goldValue) ? goldValue : 0
            };
        }

        const scoreValue = Number(normalized);
        return {
            type: 'score',
            value: Number.isFinite(scoreValue) ? scoreValue : 0
        };
    }

    // 제출 계산 규칙: 점수/골드를 분리하고, xN은 바로 앞 눈의 결과를 배율로 갱신합니다.
    function calculateRollOutcome(faceTokens) {
        const contributions = faceTokens.map(() => ({ score: 0, gold: 0 }));

        faceTokens.forEach((faceToken, index) => {
            const parsed = parseFaceToken(faceToken);

            if (parsed.type === 'score') {
                contributions[index] = { score: parsed.value, gold: 0 };
                return;
            }

            if (parsed.type === 'gold') {
                contributions[index] = { score: 0, gold: parsed.value };
                return;
            }

            if (index === 0) {
                // 첫 번째 눈이 배율이면 앞눈이 없으므로 0으로 처리합니다.
                contributions[index] = { score: 0, gold: 0 };
                return;
            }

            // 배율의 결과를 현재 눈 위치로 이동시켜 연속 xN 체인이 가능하도록 처리합니다.
            contributions[index] = {
                score: contributions[index - 1].score * parsed.value,
                gold: contributions[index - 1].gold * parsed.value
            };
            contributions[index - 1] = { score: 0, gold: 0 };
        });

        return contributions.reduce((acc, current) => ({
            score: acc.score + current.score,
            gold: acc.gold + current.gold
        }), { score: 0, gold: 0 });
    }

    // 시작 주사위를 카탈로그 구조로 변환해 다른 주사위와 동일한 렌더링 경로를 사용합니다.
    function createStarterDice() {
        return BASE_STARTER_DICE.map((faces, index) => ({
            id: `starter-${index + 1}`,
            tierKey: '1',
            tierName: TIER_NAMES['1'],
            faces: [...faces]
        }));
    }

    // 등급 확률(80/15/4/1)에 따라 주사위 하나를 추첨합니다.
    function pickWeightedRandomDice() {
        const totalWeight = CONFIG.TIER_PROBABILITIES.reduce((sum, entry) => sum + entry.weight, 0);
        let randomPoint = Math.random() * totalWeight;

        for (const entry of CONFIG.TIER_PROBABILITIES) {
            randomPoint -= entry.weight;
            if (randomPoint <= 0) {
                const pool = DICE_CATALOG[entry.tierKey];
                return pool[Math.floor(Math.random() * pool.length)];
            }
        }

        return DICE_CATALOG['1'][0];
    }

    // 주사위 뽑기 선택지를 생성합니다.
    function buildDraftOptions() {
        return Array.from({ length: CONFIG.DRAFT_OPTION_COUNT }, () => {
            const picked = pickWeightedRandomDice();
            return { ...picked, faces: [...picked.faces] };
        });
    }

    function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function updateUI() {
        stageEl.innerText = currentStage;
        stageMaxEl.innerText = CONFIG.TOTAL_STAGES;
        scoreEl.innerText = stageScore;
        goldEl.innerText = totalGold;
        // 상점 단계에서는 다음 스테이지 목표 점수를 보여줘 다음 난이도를 미리 확인할 수 있게 합니다.
        const targetStageIndex = isShopPhase && currentStage < CONFIG.TOTAL_STAGES ? currentStage : currentStage - 1;
        targetEl.innerText = CONFIG.STAGE_TARGETS[targetStageIndex];
        rollsLeftEl.innerText = rollsLeftInStage;
        rollsMaxEl.innerText = rollsPerStage;
        updateShopButtons();
    }

    // 상점 가격은 행동 1회마다 +1G가 누적되고, 다음 상점에서 초기화됩니다.
    function getShopActionCost(actionKey) {
        const increasedCost = shopActionPriceIncrease[actionKey] ?? 0;
        return CONFIG.SHOP_BASE_PRICES[actionKey] + increasedCost;
    }

    function formatScoreToken(scoreValue) {
        if (scoreValue > 0) return `+${scoreValue}`;
        return String(scoreValue);
    }

    // 점수/골드 눈금만 상점 변형 대상으로 처리하고, xN 배율 눈금은 그대로 둡니다.
    function transformFaceToken(faceToken, transformer) {
        const parsed = parseFaceToken(faceToken);
        if (parsed.type === 'multiplier') return faceToken;

        const transformedValue = transformer(parsed.value);
        if (parsed.type === 'gold') {
            return `${transformedValue}G`;
        }
        return formatScoreToken(transformedValue);
    }


    // 라운드 점수/골드 UI에 표시할 부호 포함 문자열을 생성합니다.
    function formatSignedValue(value, suffix = '') {
        return `${value >= 0 ? '+' : ''}${value}${suffix}`;
    }

    // 라운드 표시 영역은 값만 보이도록 양수 부호(+)를 생략합니다.
    function updateRoundSummary(scoreValue, goldValue) {
        roundScoreEl.innerText = String(scoreValue);
        roundGoldEl.innerText = `${goldValue}G`;
    }

    function resetRoundSummary() {
        roundScoreEl.innerText = ROUND_SUMMARY_DEFAULT.SCORE;
        roundGoldEl.innerText = ROUND_SUMMARY_DEFAULT.GOLD;
    }
    function pickRandomMutableFaceIndex(dice) {
        const mutableIndexes = dice.faces
            .map((faceToken, index) => ({ faceToken, index }))
            .filter(({ faceToken }) => parseFaceToken(faceToken).type !== 'multiplier')
            .map(({ index }) => index);

        if (mutableIndexes.length === 0) return null;
        return mutableIndexes[Math.floor(Math.random() * mutableIndexes.length)];
    }

    function updateShopButtons() {
        const absCost = getShopActionCost('ABS_UP');
        const faceUpCost = getShopActionCost('FACE_UP');
        const faceDownCost = getShopActionCost('FACE_DOWN');
        const invertCost = getShopActionCost('SIGN_INVERT');
        const sellCost = getShopActionCost('SELL');
        const drawCost = getShopActionCost('DRAW');
        const hasSelection = selectedShopDiceIndex !== null;
        const canSell = hasSelection && diceState.length > 1;

        shopAbsUpPriceEl.innerText = `${absCost}G`;
        shopFaceUpPriceEl.innerText = `${faceUpCost}G`;
        shopFaceDownPriceEl.innerText = `${faceDownCost}G`;
        shopInvertPriceEl.innerText = `${invertCost}G`;
        shopSellPriceEl.innerText = `${sellCost}G`;
        shopDrawPriceEl.innerText = `${drawCost}G`;

        shopAbsUpBtn.disabled = !isShopPhase || !hasSelection || totalGold < absCost;
        shopFaceUpBtn.disabled = !isShopPhase || !hasSelection || totalGold < faceUpCost;
        shopFaceDownBtn.disabled = !isShopPhase || !hasSelection || totalGold < faceDownCost;
        shopInvertBtn.disabled = !isShopPhase || !hasSelection || totalGold < invertCost;
        // 판매는 골드 소모 없이 진행하므로 보유 골드와 무관하게 활성화합니다.
        shopSellBtn.disabled = !isShopPhase || !canSell;
        shopDrawBtn.disabled = !isShopPhase || totalGold < drawCost;
    }

    function buildDiceFacesPreview(dice) {
        const preview = document.createElement('div');
        preview.className = 'dice-faces';

        dice.faces.forEach((faceToken) => {
            const parsed = parseFaceToken(faceToken);
            const faceValue = parsed.value;
            const faceCell = document.createElement('span');
            faceCell.className = `face-cell ${faceValue >= 0 ? 'red' : 'blue'}`;
            faceCell.innerText = faceToken;
            preview.appendChild(faceCell);
        });

        return preview;
    }

    function bindDiceDragEvents(diceEl) {
        diceEl.addEventListener('dragstart', (event) => {
            if (isRolling || isDrafting) {
                event.preventDefault();
                return;
            }

            draggingDiceIndex = Number(diceEl.dataset.index);
            diceEl.classList.add('drag-source');
            event.dataTransfer.effectAllowed = 'move';
        });

        diceEl.addEventListener('dragover', (event) => {
            // 상점 단계에서도 주사위 위치 이동이 가능하도록 롤 버튼 비활성화 상태는 검사하지 않습니다.
            if (draggingDiceIndex === null || isDrafting) return;
            event.preventDefault();
            diceEl.classList.add('drag-over');
        });

        diceEl.addEventListener('dragleave', () => {
            diceEl.classList.remove('drag-over');
        });

        diceEl.addEventListener('drop', (event) => {
            event.preventDefault();
            const targetIndex = Number(diceEl.dataset.index);
            reorderDice(draggingDiceIndex, targetIndex);
        });

        diceEl.addEventListener('dragend', () => {
            clearDragStyles();
        });
    }

    function clearDragStyles() {
        draggingDiceIndex = null;
        document.querySelectorAll('.dice').forEach((el) => el.classList.remove('drag-source', 'drag-over'));
    }

    // 기존 주사위 위치 변경 기능을 유지하기 위해 배열 재정렬을 지원합니다.
    function reorderDice(fromIndex, toIndex) {
        if (fromIndex === null || toIndex === null || fromIndex === toIndex) {
            clearDragStyles();
            return;
        }

        const movedDice = diceState.splice(fromIndex, 1)[0];
        diceState.splice(toIndex, 0, movedDice);
        renderDice();
        calcStatusEl.innerText = '주사위 순서를 변경했습니다.';
        clearDragStyles();
    }

    function renderDice() {
        diceContainer.innerHTML = '';

        diceState.forEach((dice, index) => {
            const div = document.createElement('div');
            div.id = `dice-${index}`;
            // 티어별 식별이 쉽도록 주사위 테두리 색상 클래스를 함께 적용합니다.
            div.className = `dice blue tier-${dice.tierKey}`;
            div.draggable = true;
            div.dataset.index = String(index);

            const result = document.createElement('span');
            result.className = 'dice-result';
            result.innerText = '?';

            div.appendChild(result);
            div.appendChild(buildDiceFacesPreview(dice));

            // 상점 단계에서는 클릭으로 대상 주사위를 선택합니다.
            div.addEventListener('click', () => {
                if (!isShopPhase || isRolling || isDrafting) return;
                selectedShopDiceIndex = index;
                renderDice();
                shopMetaEl.innerText = `${index + 1}번 주사위를 선택했습니다. 원하는 행동을 고르세요.`;
                updateShopButtons();
            });

            if (isShopPhase && selectedShopDiceIndex === index) {
                div.classList.add('shop-selected');
            }

            bindDiceDragEvents(div);
            diceContainer.appendChild(div);
        });
    }

    async function onRollDice() {
        if (rollsLeftInStage <= 0 || isRolling || isDrafting) return;

        rollsLeftInStage -= 1;
        isRolling = true;
        rollBtn.disabled = true;
        submitBtn.disabled = true;
        calcStatusEl.innerText = '주사위를 굴리는 중...';

        document.querySelectorAll('.dice').forEach((el) => el.classList.add('rolling'));
        await wait(CONFIG.ROLL_ANIMATION_MS);

        lastRollResults = diceState.map((dice, index) => {
            const rollValue = dice.faces[Math.floor(Math.random() * dice.faces.length)];
            const el = document.getElementById(`dice-${index}`);
            const resultEl = el.querySelector('.dice-result');
            const parsedToken = parseFaceToken(rollValue);
            const parsedValue = parsedToken.value;

            el.classList.remove('rolling');
            el.classList.remove('red', 'blue');
            el.classList.add(parsedValue >= 0 ? 'red' : 'blue');
            resultEl.innerText = rollValue;

            return rollValue;
        });

        const previewOutcome = calculateRollOutcome(lastRollResults);
        updateRoundSummary(previewOutcome.score, previewOutcome.gold);
        calcStatusEl.innerText = `이번 결과 미리보기: 점수 ${formatSignedValue(previewOutcome.score)}, 골드 ${formatSignedValue(previewOutcome.gold, 'G')} (제출 시 반영)`;

        // 제출 전에도 다음 롤을 진행할 수 있도록 롤 버튼은 즉시 다시 활성화합니다.
        isRolling = false;
        rollBtn.disabled = rollsLeftInStage <= 0;
        submitBtn.disabled = false;
        updateUI();
    }

    async function onSubmitRoll() {
        if (lastRollResults.length === 0) return;

        const turnOutcome = calculateRollOutcome(lastRollResults);
        const turnScore = turnOutcome.score;
        const turnGold = turnOutcome.gold;
        stageScore += turnScore;
        totalGold += turnGold;
        lastRollResults = [];
        submitBtn.disabled = true;
        resetRoundSummary();

        updateUI();

        const targetScore = CONFIG.STAGE_TARGETS[currentStage - 1];
        if (stageScore >= targetScore) {
            await wait(CONFIG.RESULT_DELAY_MS);
            await handleStageClear();
            return;
        }

        if (rollsLeftInStage <= 0) {
            await wait(CONFIG.RESULT_DELAY_MS);
            showGameResult(false);
            return;
        }

        calcStatusEl.innerText = `제출 완료! 점수 ${turnScore >= 0 ? '+' : ''}${turnScore}, 골드 ${turnGold >= 0 ? '+' : ''}${turnGold}G 획득. 다음 롤을 진행하세요.`;
        rollBtn.disabled = rollsLeftInStage <= 0;
    }

    async function handleStageClear() {
        // 스테이지 클리어 보상은 기본 10G + 남은 롤 보너스(롤당 2G)로 계산합니다.
        const earnedGold = CONFIG.CLEAR_BASE_GOLD + (rollsLeftInStage * CONFIG.CLEAR_GOLD_PER_REMAINING_ROLL);
        totalGold += earnedGold;
        updateUI();
        calcStatusEl.innerText = `스테이지 클리어! 기본 +${CONFIG.CLEAR_BASE_GOLD}G, 남은 롤 보너스 포함 총 +${earnedGold}G`;

        // 스테이지 클리어 직후에는 기존 규칙대로 즉시 뽑기를 먼저 진행합니다.
        const pickedDice = await openDiceDraftModal();
        diceState.push(pickedDice);
        // 뽑기 직후 결과를 확인할 수 있도록 보드에 먼저 반영합니다.
        renderDice();

        // 즉시 뽑기 완료 후 상점으로 전환합니다.
        openShopPanel();
    }

    function openShopPanel() {
        isShopPhase = true;
        selectedShopDiceIndex = null;
        shopActionPriceIncrease = createInitialShopPriceIncreaseMap();
        stageControls.classList.add('hidden');
        shopPanel.classList.remove('hidden');
        rollBtn.disabled = true;
        submitBtn.disabled = true;
        resetRoundSummary();
        updateUI();
        calcStatusEl.innerText = '상점 단계입니다. 주사위를 선택해 강화/판매/뽑기를 진행하세요.';
        shopMetaEl.innerText = '주사위를 선택하고 행동을 고르세요. 행동 1회마다 상점 가격이 +1G 증가합니다.';
        renderDice();
        updateShopButtons();
    }

    async function executeShopAction(actionKey) {
        if (!isShopPhase || isDrafting || isRolling) return;

        const actionCost = getShopActionCost(actionKey);
        if (actionKey !== 'SELL' && totalGold < actionCost) {
            calcStatusEl.innerText = `골드가 부족합니다. (${actionCost}G 필요)`;
            return;
        }

        const selectedDice = selectedShopDiceIndex !== null ? diceState[selectedShopDiceIndex] : null;
        const requiresSelectedDice = actionKey !== 'DRAW';
        if (requiresSelectedDice && !selectedDice) {
            calcStatusEl.innerText = '먼저 대상 주사위를 선택하세요.';
            return;
        }

        if (actionKey !== 'SELL') {
            totalGold -= actionCost;
        }

        if (actionKey === 'ABS_UP') {
            // 0은 유지하고 절대값만 +1 하는 규칙을 적용합니다.
            selectedDice.faces = selectedDice.faces.map((faceToken) => transformFaceToken(faceToken, (value) => {
                if (value === 0) return 0;
                return Math.sign(value) * (Math.abs(value) + 1);
            }));
            calcStatusEl.innerText = `${selectedShopDiceIndex + 1}번 주사위의 모든 눈금 절대값이 +1 되었습니다.`;
        } else if (actionKey === 'FACE_UP') {
            const faceIndex = pickRandomMutableFaceIndex(selectedDice);
            if (faceIndex === null) {
                calcStatusEl.innerText = '변경 가능한 눈금이 없습니다.';
                totalGold += actionCost;
                return;
            }
            selectedDice.faces[faceIndex] = transformFaceToken(selectedDice.faces[faceIndex], (value) => value + 1);
            calcStatusEl.innerText = `${selectedShopDiceIndex + 1}번 주사위의 무작위 눈금이 +1 되었습니다.`;
        } else if (actionKey === 'FACE_DOWN') {
            const faceIndex = pickRandomMutableFaceIndex(selectedDice);
            if (faceIndex === null) {
                calcStatusEl.innerText = '변경 가능한 눈금이 없습니다.';
                totalGold += actionCost;
                return;
            }
            selectedDice.faces[faceIndex] = transformFaceToken(selectedDice.faces[faceIndex], (value) => value - 1);
            calcStatusEl.innerText = `${selectedShopDiceIndex + 1}번 주사위의 무작위 눈금이 -1 되었습니다.`;
        } else if (actionKey === 'SIGN_INVERT') {
            const faceIndex = pickRandomMutableFaceIndex(selectedDice);
            if (faceIndex === null) {
                calcStatusEl.innerText = '변경 가능한 눈금이 없습니다.';
                totalGold += actionCost;
                return;
            }
            selectedDice.faces[faceIndex] = transformFaceToken(selectedDice.faces[faceIndex], (value) => value * -1);
            calcStatusEl.innerText = `${selectedShopDiceIndex + 1}번 주사위의 무작위 눈금 부호가 반전되었습니다.`;
        } else if (actionKey === 'SELL') {
            if (diceState.length <= 1) {
                calcStatusEl.innerText = '마지막 1개 주사위는 판매할 수 없습니다.';
                totalGold += actionCost;
                return;
            }
            const soldDice = diceState.splice(selectedShopDiceIndex, 1)[0];
            const saleGold = CONFIG.SELL_GOLD_BY_TIER[soldDice.tierKey] ?? CONFIG.SELL_GOLD_BY_TIER['1'];
            // 판매 골드는 비용 차감 이후 별도로 합산해 UI에 즉시 반영합니다.
            totalGold = totalGold + saleGold;
            selectedShopDiceIndex = null;
            calcStatusEl.innerText = `주사위를 판매해 ${saleGold}G를 얻었습니다.`;
        } else if (actionKey === 'DRAW') {
            const pickedDice = await openDiceDraftModal();
            diceState.push(pickedDice);
            calcStatusEl.innerText = `뽑기로 주사위(${pickedDice.tierName} / ${pickedDice.id})를 획득했습니다.`;
        }

        // 행동 수행 성공 시 해당 행동의 상점 가격만 1G 누적 증가시킵니다.
        shopActionPriceIncrease[actionKey] = (shopActionPriceIncrease[actionKey] ?? 0) + 1;
        renderDice();
        updateUI();
    }



    function proceedNextStage() {
        currentStage += 1;
        if (currentStage > CONFIG.TOTAL_STAGES) {
            showGameResult(true);
            return;
        }

        stageScore = 0;
        rollsLeftInStage = rollsPerStage;
        lastRollResults = [];
        isShopPhase = false;
        selectedShopDiceIndex = null;
        shopActionPriceIncrease = createInitialShopPriceIncreaseMap();
        shopPanel.classList.add('hidden');
        stageControls.classList.remove('hidden');

        renderDice();
        updateUI();
        resetRoundSummary();
        rollBtn.disabled = false;
        submitBtn.disabled = true;
        calcStatusEl.innerText = `스테이지 ${currentStage} 시작!`;
    }

    function showGameResult(isWin) {
        resultTitleEl.innerText = isWin ? '모든 스테이지 완료!' : '게임 오버';
        resultDescEl.innerHTML = isWin
            ? `축하합니다!<br>최종 골드: <b>${totalGold}G</b>`
            : `목표 달성 실패!<br>도달 스테이지: <b>${currentStage}</b>, 골드: <b>${totalGold}G</b>`;
        resultModal.style.display = 'flex';
        rollBtn.disabled = true;
        submitBtn.disabled = true;
    }

    function openDiceDraftModal() {
        return new Promise((resolve) => {
            isDrafting = true;
            const options = buildDraftOptions();
            const selected = new Set();

            draftDescEl.innerText = `${CONFIG.DRAFT_OPTION_COUNT}개 중 ${CONFIG.DRAFT_PICK_COUNT}개를 선택하세요. (등급 확률 1:80%, 2:15%, 3:4%, S:1%)`;
            draftGridEl.innerHTML = '';
            draftConfirmBtn.disabled = true;

            options.forEach((dice, index) => {
                const card = document.createElement('div');
                card.className = 'draft-card';

                const title = document.createElement('div');
                title.className = 'draft-card-title';
                title.innerText = `${dice.tierName} / ${dice.id}`;

                const faces = document.createElement('div');
                faces.className = 'draft-faces';
                dice.faces.forEach((faceToken) => {
                    const face = document.createElement('span');
                    const parsed = parseFaceToken(faceToken);
                    const faceValue = parsed.value;
                    face.className = `draft-face ${faceValue > 0 ? 'pos' : faceValue < 0 ? 'neg' : 'neu'}`;
                    face.innerText = faceToken;
                    faces.appendChild(face);
                });

                card.appendChild(title);
                card.appendChild(faces);

                card.addEventListener('click', () => {
                    if (selected.has(index)) {
                        selected.delete(index);
                        card.classList.remove('selected');
                    } else if (selected.size >= CONFIG.DRAFT_PICK_COUNT && CONFIG.DRAFT_REPLACE_SELECTION_WHEN_FULL) {
                        // 선택 가능한 개수가 가득 찬 상태에서 새 카드를 누르면 기존 선택을 교체합니다.
                        const previousSelected = [...selected];
                        selected.clear();
                        previousSelected.forEach((selectedIndex) => {
                            const oldCard = draftGridEl.children[selectedIndex];
                            oldCard?.classList.remove('selected');
                        });
                        selected.add(index);
                        card.classList.add('selected');
                    } else if (selected.size < CONFIG.DRAFT_PICK_COUNT) {
                        selected.add(index);
                        card.classList.add('selected');
                    }

                    draftConfirmBtn.disabled = selected.size !== CONFIG.DRAFT_PICK_COUNT;
                });

                draftGridEl.appendChild(card);
            });

            draftConfirmBtn.onclick = () => {
                const selectedIndex = [...selected][0];
                draftModal.style.display = 'none';
                isDrafting = false;
                resolve({ ...options[selectedIndex], faces: [...options[selectedIndex].faces] });
            };

            draftModal.style.display = 'flex';
        });
    }

    function resetGame() {
        currentStage = 1;
        stageScore = 0;
        totalGold = 0;
        rollsPerStage = CONFIG.INITIAL_ROLLS_PER_STAGE;
        rollsLeftInStage = rollsPerStage;
        lastRollResults = [];
        isDrafting = false;
        isRolling = false;
        isShopPhase = false;
        selectedShopDiceIndex = null;
        shopActionPriceIncrease = createInitialShopPriceIncreaseMap();
        diceState = createStarterDice();

        resultModal.style.display = 'none';
        draftModal.style.display = 'none';
        shopPanel.classList.add('hidden');
        stageControls.classList.remove('hidden');

        renderDice();
        updateUI();
        resetRoundSummary();
        rollBtn.disabled = false;
        submitBtn.disabled = true;
        calcStatusEl.innerText = '스테이지 1 시작! 주사위를 굴리고 결과를 제출하세요.';
    }

    rollBtn.addEventListener('click', onRollDice);
    submitBtn.addEventListener('click', onSubmitRoll);
    nextStageBtn.addEventListener('click', proceedNextStage);
    shopAbsUpBtn.addEventListener('click', () => executeShopAction('ABS_UP'));
    shopFaceUpBtn.addEventListener('click', () => executeShopAction('FACE_UP'));
    shopFaceDownBtn.addEventListener('click', () => executeShopAction('FACE_DOWN'));
    shopInvertBtn.addEventListener('click', () => executeShopAction('SIGN_INVERT'));
    shopSellBtn.addEventListener('click', () => executeShopAction('SELL'));
    shopDrawBtn.addEventListener('click', () => executeShopAction('DRAW'));
    restartBtn.addEventListener('click', resetGame);

    resetGame();
</script>
</body>
</html>
