<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roll The Dice</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f5f6fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .game-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 500px; text-align: center; }
        h1 { color: #2f3542; margin-top: 0; margin-bottom: 20px; font-size: 2.5rem; letter-spacing: -1px; font-weight: 800; }
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; font-size: 1.1rem; gap: 10px; }

        .score-board { font-size: 3.2rem; font-weight: bold; margin-bottom: 8px; color: #2f3542; }
        .pending-board { font-size: 1.4rem; font-weight: 700; color: #57606f; margin-bottom: 14px; }
        .status { min-height: 24px; margin-bottom: 10px; color: #57606f; font-size: 0.95rem; font-weight: 600; }

        .dice-container { display: flex; justify-content: center; gap: 10px; margin: 26px 0; flex-wrap: wrap; }
        .dice { width: 78px; height: 78px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 1.4rem; font-weight: bold; color: white; border: 4px solid #ddd; position: relative; }
        .dice.red { background-color: #ff4757; border-color: #ff6b81; box-shadow: 0 4px 0 #ee3545; }
        .dice.blue { background-color: #2f3542; border-color: #57606f; box-shadow: 0 4px 0 #1e242e; }
        .dice.rolling { animation: shake 0.2s infinite; }
        @keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(5deg); } 75% { transform: rotate(-5deg); } 100% { transform: rotate(0deg); } }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button { padding: 14px 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 1.1rem; }
        #roll-btn { background-color: #2ed573; color: white; box-shadow: 0 4px 0 #26af5f; }
        #submit-btn { background-color: #1e90ff; color: white; box-shadow: 0 4px 0 #176fc2; }
        button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
        button:disabled { background-color: #ccc !important; box-shadow: none !important; transform: none !important; cursor: not-allowed; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 360px; }
        .modal-title { font-size: 1.8rem; font-weight: bold; margin-bottom: 18px; color: #2f3542; }
        .modal-result { font-size: 1rem; margin-bottom: 24px; color: #57606f; line-height: 1.6; }
        .modal-result b { display: inline-block; margin-top: 10px; font-size: 2.4rem; color: #2f3542; }
        .modal-btn { width: 100%; background-color: #3742fa; color: white; box-shadow: 0 4px 0 #2f35b0; }
    </style>
</head>
<body>
<div class="game-card">
    <h1>Roll The Dice</h1>

    <div class="header">
        <div>스테이지: <span id="stage-num">1</span> / <span id="stage-max">1</span></div>
        <div style="color: #ffa502;">보유 골드: <span id="gold">0</span>G</div>
    </div>

    <div style="margin-bottom: 15px; padding: 15px; background-color: #f0f0f0; border-radius: 10px;">
        <div style="color: #666; font-size: 0.9rem; margin-bottom: 8px;">목표 점수</div>
        <div style="font-size: 1.2rem; color: #ff4757; font-weight: bold;"><span id="target-score">0</span> 점</div>
    </div>

    <div class="score-board" id="total-score">0</div>
    <div class="pending-board">최근 굴림 결과: <span id="pending-score">-</span></div>
    <div id="status" class="status"></div>
    <div style="margin-bottom: 20px; color: #666;">현재 스테이지 점수 (남은 롤: <span id="rolls-left">0</span>)</div>

    <div id="dice-container" class="dice-container"></div>

    <div class="controls">
        <button id="roll-btn">주사위 굴리기</button>
        <button id="submit-btn" disabled>결과 제출</button>
    </div>
</div>

<div id="result-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-title" id="modal-title">게임 완료!</div>
        <div class="modal-result">
            <span id="modal-msg">모든 스테이지를 완료했습니다!</span>
            <b id="modal-final-score">0</b><br>
            획득한 골드: <span id="modal-final-gold">0</span>G
        </div>
        <button class="modal-btn" onclick="resetGame()">다시 하기</button>
    </div>
</div>

<script>
    // 게임 밸런스 수치를 상수로 분리해 유지보수 시 하드코딩 변경 범위를 최소화합니다.
    const CONFIG = Object.freeze({
        ROLLS_PER_STAGE: 5,
        STAGE_TARGETS: Object.freeze([6, 10, 14, 18, 24, 30, 36, 42, 50, 60]),
        ROLL_ANIMATION_MS: 500
    });

    // 요청된 기본 주사위 3개를 고정 템플릿으로 관리합니다.
    const BASE_DICE_FACES = Object.freeze([
        Object.freeze([0, 0, 0, 1, 1, 1]),
        Object.freeze([-1, -1, -1, 1, 1, 1]),
        Object.freeze([-3, -2, -1, 1, 2, 3])
    ]);

    let currentStage = 1;
    let stageScore = 0;
    let totalGold = 0;
    let rollsLeft = CONFIG.ROLLS_PER_STAGE;
    let pendingRollScore = null;

    const stageNumEl = document.getElementById('stage-num');
    const stageMaxEl = document.getElementById('stage-max');
    const goldEl = document.getElementById('gold');
    const targetScoreEl = document.getElementById('target-score');
    const totalScoreEl = document.getElementById('total-score');
    const pendingScoreEl = document.getElementById('pending-score');
    const statusEl = document.getElementById('status');
    const rollsLeftEl = document.getElementById('rolls-left');
    const diceContainer = document.getElementById('dice-container');
    const rollBtn = document.getElementById('roll-btn');
    const submitBtn = document.getElementById('submit-btn');

    const resultModal = document.getElementById('result-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalMsg = document.getElementById('modal-msg');
    const modalFinalScore = document.getElementById('modal-final-score');
    const modalFinalGold = document.getElementById('modal-final-gold');

    function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
    }

    // 주사위 색상 표현 로직을 분리해 점수 표시 규칙을 명확히 유지합니다.
    function diceColorClass(value) {
        return value >= 0 ? 'red' : 'blue';
    }

    function updateUI() {
        stageNumEl.innerText = currentStage;
        stageMaxEl.innerText = CONFIG.STAGE_TARGETS.length;
        goldEl.innerText = totalGold;
        targetScoreEl.innerText = CONFIG.STAGE_TARGETS[currentStage - 1];
        totalScoreEl.innerText = stageScore;
        rollsLeftEl.innerText = rollsLeft;
        pendingScoreEl.innerText = pendingRollScore === null ? '-' : `${pendingRollScore >= 0 ? '+' : ''}${pendingRollScore}`;

        // 제출 가능한 상태일 때만 제출 버튼을 활성화합니다.
        submitBtn.disabled = pendingRollScore === null;

        // 롤 횟수를 모두 사용했거나 제출 대기 중이면 롤 버튼을 잠급니다.
        rollBtn.disabled = rollsLeft <= 0 || pendingRollScore !== null;
    }

    function renderDice(values = ['?', '?', '?']) {
        diceContainer.innerHTML = '';
        values.forEach((value) => {
            const div = document.createElement('div');
            div.className = `dice ${typeof value === 'number' ? diceColorClass(value) : 'blue'}`;
            div.innerText = value;
            diceContainer.appendChild(div);
        });
    }

    function pickRandomFace(faces) {
        return faces[Math.floor(Math.random() * faces.length)];
    }

    async function rollDice() {
        if (rollsLeft <= 0 || pendingRollScore !== null) return;

        rollsLeft -= 1;
        statusEl.innerText = '주사위를 굴리는 중...';
        updateUI();

        const diceElements = [...document.querySelectorAll('.dice')];
        diceElements.forEach((el) => el.classList.add('rolling'));
        await wait(CONFIG.ROLL_ANIMATION_MS);

        const rolledValues = BASE_DICE_FACES.map((faces) => pickRandomFace(faces));
        pendingRollScore = rolledValues.reduce((acc, value) => acc + value, 0);

        renderDice(rolledValues);
        statusEl.innerText = `최근 결과 ${pendingRollScore >= 0 ? '+' : ''}${pendingRollScore}점을 제출할 수 있습니다.`;
        updateUI();
    }

    function completeStage() {
        // 스테이지 클리어 시 남은 롤 수만큼 골드를 지급합니다.
        const rewardGold = rollsLeft;
        totalGold += rewardGold;

        if (currentStage >= CONFIG.STAGE_TARGETS.length) {
            modalTitle.innerText = '게임 완료!';
            modalMsg.innerText = `모든 스테이지를 클리어했습니다! (마지막 보너스 ${rewardGold}G)`;
            modalFinalScore.innerText = stageScore;
            modalFinalGold.innerText = totalGold;
            resultModal.style.display = 'flex';
            return;
        }

        currentStage += 1;
        stageScore = 0;
        rollsLeft = CONFIG.ROLLS_PER_STAGE;
        pendingRollScore = null;
        renderDice();
        statusEl.innerText = `스테이지 클리어! 보너스 ${rewardGold}G 획득, 다음 스테이지 시작!`;
        updateUI();
    }

    function failStage() {
        modalTitle.innerText = 'Game Over';
        modalMsg.innerText = `스테이지 ${currentStage} 실패! 목표 점수를 넘지 못했습니다.`;
        modalFinalScore.innerText = stageScore;
        modalFinalGold.innerText = totalGold;
        resultModal.style.display = 'flex';
    }

    function submitRollResult() {
        if (pendingRollScore === null) return;

        stageScore += pendingRollScore;
        pendingRollScore = null;
        statusEl.innerText = '결과를 점수에 반영했습니다.';

        const targetScore = CONFIG.STAGE_TARGETS[currentStage - 1];
        if (stageScore >= targetScore) {
            completeStage();
            return;
        }

        if (rollsLeft <= 0) {
            failStage();
            return;
        }

        updateUI();
    }

    function resetGame() {
        currentStage = 1;
        stageScore = 0;
        totalGold = 0;
        rollsLeft = CONFIG.ROLLS_PER_STAGE;
        pendingRollScore = null;
        resultModal.style.display = 'none';
        renderDice();
        statusEl.innerText = '스테이지 1 시작! 주사위를 굴려 결과를 확인하세요.';
        updateUI();
    }

    rollBtn.addEventListener('click', rollDice);
    submitBtn.addEventListener('click', submitRollResult);

    resetGame();
</script>
</body>
</html>
